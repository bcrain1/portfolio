name: Governed data service checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test standalone project or portfolio subfolder
        shell: bash
        run: |
          if [ -d governed_data_service ]; then cd governed_data_service; fi
          python -m pip install -r requirements.txt
          python -B -m unittest discover -s tests -v

